[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "triplex-python"
# Placeholder: versions are git tags created by CI, never edited by hand.
version = "0.0.0"
description = "Triplex Analytics in plain Python: schema contracts, anonymization and synthetic data, run locally."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "pyarrow", "pandas", "polars"]

[tool.maturin]
python-source = "python"
module-name = "triplex._native"
