[package]
name = "triplex-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The extension module `import triplex` loads; python/triplex/__init__.py is
# the public surface, this is its engine.
name = "_native"
crate-type = ["cdylib"]
# Tested from Python (tests/, pytest). A Rust test binary would have to link
# libpython, which `cargo test --workspace` should not need.
test = false
doctest = false

[dependencies]
triplex-core = { workspace = true }
triplex-io = { workspace = true }
triplex-schemacast = { workspace = true }
triplex-anonymizer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# abi3: one wheel for every CPython from 3.9 on, and no interpreter needed
# at build time.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
