name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: fmt, clippy, test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Compiles apps/triplex-web for the browser target only — confirms
      # the wasm-bindgen surface still builds. Does not run wasm-bindgen or
      # the www/ Vite pipeline: that's frontend tooling, out of scope for
      # this backend-only gate.
      - run: cargo build -p triplex-web --target wasm32-unknown-unknown --release

  frontend:
    name: lint, typecheck, format, test (www)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/triplex-web/www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which the lockfile was written with. npm 10
          # (Node 22) rejects it: it wants an optional peer (esbuild) locked.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/triplex-web/www/package-lock.json
      # None of these need the generated wasm glue in www/pkg/, so this job
      # builds no Rust. The full Vite build (which does) is not gated here.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  python:
    name: build, test (triplex-python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/triplex-python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The bindings are tested from Python against the real engine; the
      # backend job only checks that the crate compiles and passes clippy.
      - run: pip install ".[dev]"
      - run: python -m pytest tests
