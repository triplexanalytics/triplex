name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: fmt, clippy, test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Compiles apps/triplex-web for the browser target only — confirms
      # the wasm-bindgen surface still builds. Does not run wasm-bindgen or
      # the www/ Vite pipeline: that's frontend tooling, out of scope for
      # this backend-only gate (see the project guidelines's backend/frontend split).
      - run: cargo build -p triplex-web --target wasm32-unknown-unknown --release
