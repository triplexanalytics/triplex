version: 1
columns:
  - name: id
    type: string # deliberately wrong: sample.csv's id column is integer
  - name: price
    type: float
    statistics:
      max_null_percentage: 10 # deliberately too strict: sample.csv's price column is 25% null
      max_value: 10 # deliberately too strict: sample.csv's price column goes up to 12.00
      expected_mean: 100 # deliberately wrong: sample.csv's price column averages ~8.5
      mean_epsilon: 1.0
  - name: in_stock
    type: boolean
  - name: sku
    type: string # deliberately missing from sample.csv
