[package]
name = "triplex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The triplex command-line tool: schema contracts, pseudonymization, synthetic data, privacy-risk scoring and drift checks on local files."
readme = "README.md"
keywords = ["privacy", "anonymization", "schema", "synthetic-data", "cli"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "triplex"
path = "src/main.rs"

[dependencies]
triplex-schemacast = { workspace = true }
triplex-anonymizer = { workspace = true }
triplex-datasetcard = { workspace = true }
triplex-driftguard = { workspace = true }
triplex-modelcard = { workspace = true }
serde_json = { workspace = true }
