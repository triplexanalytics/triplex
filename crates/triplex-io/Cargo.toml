[package]
name = "triplex-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
triplex-core = { path = "../triplex-core" }
csv = "1"
serde = { version = "1", features = ["derive"] }
arrow-cast = { version = "59.2.0", default-features = false }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
arrow-array = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0", default-features = false }

# Parquet's snap/zstd codecs pull in C code (zstd-sys) that doesn't build for
# wasm32-unknown-unknown without a C toolchain targeting it. Parquet input is
# out of scope for apps/triplex-web (client-side WASM), so the wasm target
# gets arrow-only support (still enough to compile parquet_source.rs/
# parquet_sink.rs) while every other target keeps full codec support for
# real-world Parquet files.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parquet = { version = "59.2.0", default-features = false, features = ["snap", "zstd", "arrow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parquet = { version = "59.2.0", default-features = false, features = ["arrow"] }
