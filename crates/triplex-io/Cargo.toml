[package]
name = "triplex-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local file I/O for Triplex: CSV, TSV, JSON Lines and Parquet, read from a path or from bytes in memory, never over a network."
readme = "README.md"
keywords = ["csv", "parquet", "arrow", "privacy"]
categories = ["encoding", "parser-implementations"]

[dependencies]
triplex-core = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
arrow-cast = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc = { workspace = true }

# Parquet's snap/zstd codecs pull in C code (zstd-sys) that doesn't build for
# wasm32-unknown-unknown without a C toolchain targeting it. Parquet input is
# out of scope for apps/triplex-web (client-side WASM), so the wasm target
# gets arrow-only support (still enough to compile parquet_source.rs/
# parquet_sink.rs) while every other target keeps full codec support for
# real-world Parquet files.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parquet = { workspace = true, features = ["snap", "zstd", "arrow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parquet = { workspace = true, features = ["arrow"] }
