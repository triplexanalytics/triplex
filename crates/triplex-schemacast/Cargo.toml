[package]
name = "triplex-schemacast"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
triplex-core = { path = "../triplex-core" }
triplex-io = { path = "../triplex-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
regex = "1"

[dev-dependencies]
parquet = { version = "59.2.0", default-features = false }
arrow-array = { version = "59.2.0", default-features = false }
arrow-ipc = { version = "59.2.0", default-features = false }
