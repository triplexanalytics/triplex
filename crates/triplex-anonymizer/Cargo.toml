[package]
name = "triplex-anonymizer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local pseudonymization with a separate mapping file, and synthetic tabular data with fidelity and leakage reports."
readme = "README.md"
keywords = ["privacy", "anonymization", "pseudonymization", "synthetic-data", "gdpr"]
categories = ["science", "cryptography"]

[dependencies]
triplex-core = { workspace = true }
triplex-io = { workspace = true }
triplex-schemacast = { workspace = true }
triplex-datasetcard = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

# argon2/aes-gcm draw randomness from getrandom via OsRng, which has no
# default source on wasm32-unknown-unknown (no OS to call) — the "js"
# feature backs it with the browser's crypto.getRandomValues instead. Scoped
# to wasm32 only so native (CLI) builds don't pull in wasm-bindgen for
# nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
